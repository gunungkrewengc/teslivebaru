        run: |
          # ---------------------------------------------------------
          # BACKGROUND WORKER UNTUK FITUR BOT REAL-TIME
          # ---------------------------------------------------------
          # Worker ini akan menarik perubahan file (seperti alert.txt) dari repositori GitHub
          # setiap 10 detik agar FFmpeg bisa membaca teks baru tanpa harus mematikan live.
          (
            while true; do
              git pull --rebase > /dev/null 2>&1
              sleep 10
            done
          ) &
          
          while true; do
            FINAL_CMD=""

            # ---------------------------------------------------------
            # SAKELAR OTOMATIS: JIKA KOLOM MANUAL DIISI
            # ---------------------------------------------------------
            if [[ -n "$MANUAL_CMD" ]]; then
              echo "[SISTEM DIALIHKAN] Menggunakan murni command dari Generator HTML..."
              FINAL_CMD="$MANUAL_CMD"
            else
              # ---------------------------------------------------------
              # MODE DROPDOWN OTOMATIS
              # ---------------------------------------------------------
              echo "Menyusun komponen perintah otomatis dari dropdown..."
              CMD="ffmpeg"
              
              if [[ "$IS_RE" == "default (Gunakan -re)" ]]; then CMD="$CMD -re"; fi
              if [[ "$IS_LOOP" == "Loop Terus Menerus (-1)" ]]; then CMD="$CMD -stream_loop -1"; fi
              if [[ "$VIDEO" == "http"* ]]; then
                CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"
              fi
              CMD="$CMD -i \"$VIDEO\""
              
              if [[ -n "$AUDIO" ]]; then
                AUDIO_PRESENT=1
                if [[ "$IS_LOOP" == "Loop Terus Menerus (-1)" ]]; then CMD="$CMD -stream_loop -1"; fi
                if [[ "$AUDIO" == "http"* ]]; then CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"; fi
                CMD="$CMD -i \"$AUDIO\""
              fi
              
              if [[ -n "$IMAGE" ]]; then
                IMAGE_PRESENT=1
                # FIX: Menyuntikkan flag -loop 1 untuk file gambar statis agar tidak terputus (EOF)
                if [[ "$IMAGE" == *".png" || "$IMAGE" == *".jpg" || "$IMAGE" == *".jpeg" || "$IMAGE" == *".webp" ]]; then
                  CMD="$CMD -loop 1"
                fi
                if [[ "$IMAGE" == "http"* ]]; then CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"; fi
                CMD="$CMD -i \"$IMAGE\""
              fi
              
              FILTER=""
              V_MAP="0:v"
              A_MAP="0:a"
              USE_A_FILTER=0
              FORCE_V_ENCODE_LAY=0
              
              # FIX: Rumus min() untuk crop rasio yang aman (menghindari error "invalid dimensions")
              if [[ "$V_LAYOUT" == *"Crop"* ]]; then
                FILTER="${FILTER}[0:v]crop='min(iw,ih*9/16)':ih[v_lay];"
                V_MAP="v_lay"; FORCE_V_ENCODE_LAY=1
              elif [[ "$V_LAYOUT" == *"Kotak Hitam"* ]]; then
                FILTER="${FILTER}[0:v]pad=iw:iw*16/9:0:(oh-ih)/2:black[v_lay];"
                V_MAP="v_lay"; FORCE_V_ENCODE_LAY=1
              fi
              
              if [[ "$IMAGE_PRESENT" -eq 1 ]]; then
                IMG_IDX="1"; if [[ -n "$AUDIO" ]]; then IMG_IDX="2"; fi
                SCALE_CMD=""
                if [[ "$IMG_SCALE" != "default"* ]]; then SCALE_CMD="scale=$IMG_SCALE,"; fi
                POS="W-w-10:10"
                if [[ "$IMG_POS" == "Kiri Atas" ]]; then POS="10:10"; fi
                if [[ "$IMG_POS" == "Kanan Bawah" ]]; then POS="W-w-10:H-h-10"; fi
                if [[ "$IMG_POS" == "Kiri Bawah" ]]; then POS="10:H-h-10"; fi
                # FIX: shortest=1 disematkan agar panjang overlay menyesuaikan panjang video (bukan gambar)
                FILTER="${FILTER}[${IMG_IDX}:v]${SCALE_CMD}format=rgba[wm];[$V_MAP][wm]overlay=$POS:shortest=1[v_img];"
                V_MAP="v_img"
              fi
              
              if [[ -n "$TEXT" ]]; then
                # FIX: Proteksi dan escape karakter spesial untuk teks (titik dua, koma, dsb.)
                SAFE_TEXT="${TEXT//\'/\\\'}"
                SAFE_TEXT="${SAFE_TEXT//\%/\\%}"
                SAFE_TEXT="${SAFE_TEXT//\,/\\,}"
                SAFE_TEXT="${SAFE_TEXT//\:/\\\\:}"
                
                COLOR="white"; if [[ "$TXT_COLOR" != "default"* ]]; then COLOR="$TXT_COLOR"; fi
                SIZE="24";     if [[ "$TXT_SIZE" != "default"* ]];  then SIZE="$TXT_SIZE"; fi
                T_X="10"; T_Y="H-h-30"
                if [[ "$TXT_POS" == "Bawah Tengah" ]]; then T_X="(W-w)/2"; T_Y="H-h-30"; fi
                if [[ "$TXT_POS" == "Kiri Atas" ]]; then T_X="10"; T_Y="10"; fi
                if [[ "$TXT_POS" == "Kanan Atas" ]]; then T_X="W-w-10"; T_Y="10"; fi
                if [[ "$TXT_POS" == "Tengah Screen" ]]; then T_X="(W-w)/2"; T_Y="(H-h)/2"; fi
                # FIX: Jalur font (fontfile) ditulis absolut untuk GitHub Actions Ubuntu
                FONT_PATH="/usr/share/fonts/truetype/freefont/FreeSans.ttf"
                FILTER="${FILTER}[$V_MAP]drawtext=fontfile=${FONT_PATH}:text='$SAFE_TEXT':fontcolor=$COLOR:fontsize=$SIZE:x=$T_X:y=$T_Y[v_txt];"
                V_MAP="v_txt"
              fi
              
              if [[ -n "$AUDIO" ]]; then
                if [[ "$A_MIX" == "Gabungkan"* ]]; then
                  V_MAIN_FILT="volume=1.0"; if [[ "$A_VOL_MAIN" != "default"* ]]; then V_MAIN_FILT="volume=$A_VOL_MAIN"; fi
                  V_EXT_FILT="volume=1.0";  if [[ "$A_VOL_EXT" != "default"* ]]; then V_EXT_FILT="volume=$A_VOL_EXT"; fi
                  # FIX: Menggunakan flag `?` pada `0:a?` agar tidak langsung mati (fatal error) jika video asli bisu
                  FILTER="${FILTER}[0:a?]${V_MAIN_FILT}[a_m];[1:a]${V_EXT_FILT}[a_e];[a_m][a_e]amix=inputs=2:duration=first[a_mix];"
                  A_MAP="a_mix"; USE_A_FILTER=1
                else
                  A_MAP="1:a"
                fi
              fi
              
              if [[ -n "$FILTER" ]]; then
                FILTER=${FILTER%?}
                CMD="$CMD -filter_complex \"$FILTER\""
                if [[ "$V_MAP" == "0:v" ]]; then CMD="$CMD -map 0:v?"; else CMD="$CMD -map \"[$V_MAP]\""; fi
                if [[ "$USE_A_FILTER" -eq 1 ]]; then CMD="$CMD -map \"[$A_MAP]\""; else CMD="$CMD -map $A_MAP?"; fi
              else
                CMD="$CMD -map 0:v? -map $A_MAP?"
              fi
              
              FORCE_V_ENCODE=0; if [[ "$V_MAP" != "0:v" || "$FORCE_V_ENCODE_LAY" -eq 1 ]]; then FORCE_V_ENCODE=1; fi
              if [[ "$FORCE_V_ENCODE" -eq 1 ]]; then
                if [[ "$V_CODEC" == "default"* ]] || [[ "$V_CODEC" == "copy" ]]; then V_CODEC="libx264"; fi
                CMD="$CMD -c:v $V_CODEC"
              else
                if [[ "$V_CODEC" == "default"* ]]; then CMD="$CMD -c:v copy"; else CMD="$CMD -c:v $V_CODEC"; fi
              fi
              if [[ "$V_PRESET" != "default"* && "$V_CODEC" != "copy" ]]; then CMD="$CMD -preset $V_PRESET"; fi
              if [[ "$V_BITRATE" != "default"* ]]; then CMD="$CMD -b:v $V_BITRATE"; fi
              if [[ "$V_FPS" != "default"* && "$V_CODEC" != "copy" ]]; then CMD="$CMD -r $V_FPS"; fi
              
              FORCE_A_ENCODE=0
              if [[ "$A_VOL_MAIN" != "default"* ]] || [[ "$A_VOL_EXT" != "default"* ]]; then FORCE_A_ENCODE=1; fi

              if [[ "$USE_A_FILTER" -eq 1 ]] || [[ "$FORCE_A_ENCODE" -eq 1 ]]; then
                if [[ "$A_CODEC" == "default"* ]] || [[ "$A_CODEC" == "copy" ]]; then A_CODEC="aac"; fi
                CMD="$CMD -c:a $A_CODEC"
                if [[ "$USE_A_FILTER" -eq 0 ]]; then
                   if [[ -n "$AUDIO" ]] && [[ "$A_VOL_EXT" != "default"* ]]; then CMD="$CMD -af \"volume=$A_VOL_EXT\""; fi
                   if [[ -z "$AUDIO" ]] && [[ "$A_VOL_MAIN" != "default"* ]]; then CMD="$CMD -af \"volume=$A_VOL_MAIN\""; fi
                fi
              else
                if [[ "$A_CODEC" == "default"* ]]; then CMD="$CMD -c:a copy"; else CMD="$CMD -c:a $A_CODEC"; fi
              fi
              if [[ "$A_BITRATE" != "default"* ]]; then CMD="$CMD -b:a $A_BITRATE"; fi
              
              CMD="$CMD -f flv \"$RTMP/$KEY\""
              
              FINAL_CMD="$CMD"
            fi

            # ---------------------------------------------------------
            # EKSEKUSI .SH DINAMIS UNTUK KEAMANAN KARAKTER BASH
            # ---------------------------------------------------------
            printf "%s\n" "#!/bin/bash" "$FINAL_CMD" > run_stream.sh
            chmod +x run_stream.sh
            
            echo "================ MENJALANKAN PERINTAH ================"
            sed 's|rtmp://[^" ]*|rtmp://[STREAM_KEY_DISENSOR]|g' run_stream.sh | grep -v "#!/bin/bash"
            echo "======================================================"
            
            ./run_stream.sh
            
            if [ $? -ne 0 ]; then
              echo "Proses berhenti/Error. Mengulang kembali dalam 5 detik..."
              sleep 5
            else
              echo "Selesai dengan sukses."
              break
            fi
          done
