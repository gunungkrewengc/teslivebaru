name: FFmpeg Modular Ultimate Livestream

on:
  workflow_dispatch:
    inputs:
      manual_cmd:
        description: '⚠️ [COMMAND MANUAL] Tempel hasil generate HTML di sini (Bypass semua setting bawah)'
        required: false
        default: ''

      video:
        description: '▶️ [INPUT VIDEO] URL (m3u8/mp4) atau Nama File'
        required: false
        default: 'input.mp4'
     
      is_loop:
        description: '   ↳ Command Video: Loop Video? (-stream_loop)'
        type: choice
        options:
          - default (Tanpa Loop)
          - Loop Terus Menerus (-1)
        default: 'default (Tanpa Loop)'
      is_re:
        description: '   ↳ Command Video: Kecepatan Asli? (-re)'
        type: choice
        options:
          - default (Gunakan -re)
          - Tanpa -re (Maksimal Speed)
        default: 'default (Gunakan -re)'
      video_layout:
        description: '   ↳ Command Video: Rasio Layar / Layout HP'
        type: choice
        options:
          - default (Ikuti Video Asli)
          - Instagram/TikTok 9:16 (Crop Kanan-Kiri)
          - Instagram/TikTok 9:16 (Kotak Hitam Atas-Bawah)
        default: 'default (Ikuti Video Asli)'
      video_codec:
        description: '   ↳ Command Video: Codec (-c:v)'
        type: choice
        options:
          - default (copy)
          - libx264
          - libx265
        default: 'default (copy)'
      video_preset:
        description: '   ↳ Command Video: Preset Kecepatan (Untuk x264/x265)'
        type: choice
        options:
          - default (none)
          - ultrafast
          - veryfast
          - medium
        default: 'default (none)'
      video_bitrate:
        description: '   ↳ Command Video: Kualitas Bitrate Video (-b:v)'
        type: choice
        options:
          - default (Asli)
          - 1000k
          - 2000k
          - 3000k
          - 4000k
          - 6000k
        default: 'default (Asli)'
      video_fps:
        description: '   ↳ Command Video: Batasi FPS (-r)'
        type: choice
        options:
          - default (Asli)
          - 30
          - 60
        default: 'default (Asli)'

      audio:
        description: '🎵 [INPUT AUDIO] Opsional (Kosongkan jika pakai audio asli video)'
        required: false
        default: ''
      audio_mix:
        description: '   ↳ Command Audio: Mode Audio (Jika ada audio tambahan)'
        type: choice
        options:
          - default (Ganti Audio Asli)
          - Gabungkan (Tumpang Tindih / Mix)
        default: 'default (Ganti Audio Asli)'
      audio_codec:
        description: '   ↳ Command Audio: Codec (-c:a)'
        type: choice
        options:
          - default (copy)
          - aac
          - libmp3lame
        default: 'default (copy)'
      audio_bitrate:
        description: '   ↳ Command Audio: Bitrate Audio'
        type: choice
        options:
          - default (Asli)
          - 128k
          - 192k
          - 256k
        default: 'default (Asli)'
      audio_volume_main:
        description: '   ↳ Command Audio: Volume AUDIO ASLI VIDEO'
        type: choice
        options:
          - default (Normal)
          - 0.5 (Setengah)
          - 1.0 (Normal)
          - 1.5 (Lebih Keras)
          - 2.0 (Dua Kali Lipat)
        default: 'default (Normal)'
      audio_volume_ext:
        description: '   ↳ Command Audio: Volume AUDIO TAMBAHAN (Backsound)'
        type: choice
        options:
          - default (Normal)
          - 0.2 (Sangat Pelan - Cocok untuk Musik Latar)
          - 0.5 (Setengah)
          - 1.0 (Normal)
          - 1.5 (Lebih Keras)
        default: 'default (Normal)'

      image:
        description: '🖼️ [INPUT GAMBAR] URL/File (Kosongkan jika tidak ada)'
        required: false
        default: ''
      image_scale:
        description: '   ↳ Command Gambar: Ukuran / Lebar Gambar'
        type: choice
        options:
          - default (Ukuran Asli)
          - 100:-2 (Lebar 100px)
          - 200:-2 (Lebar 200px)
          - 300:-2 (Lebar 300px)
        default: 'default (Ukuran Asli)'
      image_pos:
        description: '   ↳ Command Gambar: Posisi Overlay'
        type: choice
        options:
          - default (Kanan Atas)
          - Kiri Atas
          - Kanan Bawah
          - Kiri Bawah
        default: 'default (Kanan Atas)'

      text:
        description: '📝 [INPUT TEKS] Ketik Teks (Kosongkan jika tidak ada)'
        required: false
        default: ''
      text_color:
        description: '   ↳ Command Teks: Warna Tulisan'
        type: choice
        options:
          - default (white)
          - red
          - yellow
          - black
        default: 'default (white)'
      text_size:
        description: '   ↳ Command Teks: Ukuran Font'
        type: choice
        options:
          - default (24)
          - 36
          - 48
          - 72
        default: 'default (24)'
      text_pos:
        description: '   ↳ Command Teks: Posisi Tulisan'
        type: choice
        options:
          - default (Bawah Tengah)
          - Kiri Atas
          - Kanan Atas
          - Tengah Screen
        default: 'default (Bawah Tengah)'

      rtmp_link:
        description: '🚀 Link RTMP Server'
        required: false
        default: 'rtmp://a.rtmp.youtube.com/live2'
      stream_key:
        description: '🔑 Stream Key'
        required: false
        default: ''

jobs:
  ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up FFmpeg 8 & Fonts
        run: |
          sudo add-apt-repository ppa:ubuntuhandbook1/ffmpeg8 -y > /dev/null
          sudo apt update -y -qq > /dev/null
          sudo apt install ffmpeg fonts-freefont-ttf -y -qq > /dev/null

      - name: Install yt-dlp (Auto-resolve YouTube URL)
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          # Install plugin PO Token untuk bypass datacenter blocking
          pip install yt-dlp[default] --break-system-packages -q
          pip install yt-dlp-get-pot --break-system-packages -q || true
          # Tulis cookies dari secret jika ada
          if [[ -n "$YT_COOKIES" ]]; then
            echo "$YT_COOKIES" > /home/runner/yt_cookies.txt
            echo "✅ Cookies YouTube berhasil dimuat dari secret."
          else
            echo "⚠️ Secret YT_COOKIES tidak ditemukan. Resolve tanpa cookies."
          fi
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          
      - name: Jalankan Core Engine FFmpeg
        env:
          MANUAL_CMD: ${{ github.event.inputs.manual_cmd }}
          VIDEO: ${{ github.event.inputs.video }}
          IS_LOOP: ${{ github.event.inputs.is_loop }}
          IS_RE: ${{ github.event.inputs.is_re }}
          V_LAYOUT: ${{ github.event.inputs.video_layout }}
          V_CODEC: ${{ github.event.inputs.video_codec }}
          V_PRESET: ${{ github.event.inputs.video_preset }}
          V_BITRATE: ${{ github.event.inputs.video_bitrate }}
          V_FPS: ${{ github.event.inputs.video_fps }}
          AUDIO: ${{ github.event.inputs.audio }}
          A_MIX: ${{ github.event.inputs.audio_mix }}
          A_CODEC: ${{ github.event.inputs.audio_codec }}
          A_BITRATE: ${{ github.event.inputs.audio_bitrate }}
          A_VOL_MAIN: ${{ github.event.inputs.audio_volume_main }}
          A_VOL_EXT: ${{ github.event.inputs.audio_volume_ext }}
          IMAGE: ${{ github.event.inputs.image }}
          IMG_SCALE: ${{ github.event.inputs.image_scale }}
          IMG_POS: ${{ github.event.inputs.image_pos }}
          TEXT: ${{ github.event.inputs.text }}
          TXT_COLOR: ${{ github.event.inputs.text_color }}
          TXT_SIZE: ${{ github.event.inputs.text_size }}
          TXT_POS: ${{ github.event.inputs.text_pos }}
          RTMP: ${{ github.event.inputs.rtmp_link }}
          KEY: ${{ github.event.inputs.stream_key }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PO_TOKEN: ${{ secrets.YT_PO_TOKEN }}
        run: |
          if [[ -n "$TEXT" ]]; then
            printf "%s\n" "$TEXT" > stream_text.txt
          else
            touch stream_text.txt
          fi
          
          # Setup cookies flag jika file tersedia
          COOKIES_FLAG=""
          if [[ -f "/home/runner/yt_cookies.txt" ]]; then
            COOKIES_FLAG="--cookies /home/runner/yt_cookies.txt"
            echo "🍪 Cookies siap digunakan."
          fi

          # Fungsi resolve YouTube URL ke HLS stream fresh
          resolve_yt_url() {
            local INPUT_URL="$1"
            if [[ "$INPUT_URL" == *"youtube.com"* || "$INPUT_URL" == *"youtu.be"* ]]; then
              echo "🔍 Mendeteksi URL YouTube. Menjalankan yt-dlp untuk resolve HLS URL..." >&2
              local RESOLVED

              # Attempt 1: ios client + cookies + PO Token (paling ampuh di datacenter)
              if [[ -n "$YT_PO_TOKEN" ]]; then
                RESOLVED=$(yt-dlp -g                   --format "best[protocol=m3u8_native]/best[protocol=m3u8]/best"                   --extractor-args "youtube:player_client=ios;po_token=web+${YT_PO_TOKEN}"                   $COOKIES_FLAG                   "$INPUT_URL" 2>/dev/null | head -n 1)
              fi

              # Attempt 2: ios+web client + cookies tanpa po_token
              if [[ -z "$RESOLVED" ]]; then
                RESOLVED=$(yt-dlp -g                   --format "best[protocol=m3u8_native]/best[protocol=m3u8]/best"                   --extractor-args "youtube:player_client=ios,web"                   $COOKIES_FLAG                   "$INPUT_URL" 2>/dev/null | head -n 1)
              fi

              # Attempt 3: mweb (mobile web) + cookies
              if [[ -z "$RESOLVED" ]]; then
                RESOLVED=$(yt-dlp -g                   --extractor-args "youtube:player_client=mweb"                   $COOKIES_FLAG                   "$INPUT_URL" 2>/dev/null | head -n 1)
              fi

              # Attempt 4: last resort tanpa cookies
              if [[ -z "$RESOLVED" ]]; then
                RESOLVED=$(yt-dlp -g                   --extractor-args "youtube:player_client=ios"                   "$INPUT_URL" 2>/dev/null | head -n 1)
              fi

              if [[ -n "$RESOLVED" ]]; then
                echo "✅ URL berhasil di-resolve fresh." >&2
                echo "$RESOLVED"
              else
                echo "❌ yt-dlp gagal semua attempt. Pastikan secret YT_COOKIES sudah diisi dan video benar-benar public." >&2
                echo "$INPUT_URL"
              fi
            else
              echo "$INPUT_URL"
            fi
          }

          while true; do
            FINAL_CMD=""

            if [[ "$MANUAL_CMD" =~ [^[:space:]] ]]; then
              echo "======================================================"
              echo "⚠️ [MODE MANUAL AKTIF] Mengabaikan setting Dropdown!"
              echo "Menggunakan murni command dari HTML Generator..."
              echo "======================================================"
              # Auto-replace jika MANUAL_CMD mengandung URL YouTube
              if [[ "$MANUAL_CMD" == *"youtube.com"* || "$MANUAL_CMD" == *"youtu.be"* ]]; then
                YT_URL=$(echo "$MANUAL_CMD" | grep -oP 'https?://[^ "'"'"']*(?:youtube\.com|youtu\.be)[^ "'"'"']*' | head -n 1)
                if [[ -n "$YT_URL" ]]; then
                  FRESH_URL=$(resolve_yt_url "$YT_URL")
                  MANUAL_CMD="${MANUAL_CMD//$YT_URL/$FRESH_URL}"
                fi
              fi
              FINAL_CMD="$MANUAL_CMD"
            else
              echo "======================================================"
              echo "⚙️ [MODE DROPDOWN AKTIF] Merakit command otomatis..."
              echo "======================================================"

              # FIX BUG #1: Inisialisasi variabel flag di awal agar tidak crash
              AUDIO_PRESENT=0
              IMAGE_PRESENT=0

              # Auto-resolve jika VIDEO adalah URL YouTube
              VIDEO=$(resolve_yt_url "$VIDEO")

              CMD="ffmpeg"
              
              if [[ "$IS_RE" == "default (Gunakan -re)" ]]; then CMD="$CMD -re"; fi
              if [[ "$IS_LOOP" == "Loop Terus Menerus (-1)" ]]; then CMD="$CMD -stream_loop -1"; fi
              if [[ "$VIDEO" == "http"* ]]; then
                CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"
              fi
              CMD="$CMD -i \"$VIDEO\""
              
              if [[ -n "$AUDIO" ]]; then
                AUDIO_PRESENT=1
                # FIX BUG #2: Audio input TIDAK menggunakan IS_LOOP (itu untuk video).
                # Audio tambahan tidak perlu di-loop kecuali ada opsi khusus.
                if [[ "$AUDIO" == "http"* ]]; then CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"; fi
                CMD="$CMD -i \"$AUDIO\""
              fi
              
              if [[ -n "$IMAGE" ]]; then
                IMAGE_PRESENT=1
                IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
                
                if [[ "$IMAGE_LOWER" == *".gif" ]]; then
                  CMD="$CMD -ignore_loop 0"
                else
                  CMD="$CMD -loop 1"
                fi
                
                if [[ "$IMAGE_LOWER" == "http"* ]]; then CMD="$CMD -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000"; fi
                CMD="$CMD -i \"$IMAGE\""
              fi
              
              FILTER=""
              V_MAP="0:v"
              A_MAP="0:a"
            
              USE_A_FILTER=0
              FORCE_V_ENCODE_LAY=0
              
              if [[ "$V_LAYOUT" == *"Crop"* ]]; then
                FILTER="${FILTER}[0:v]crop='trunc(min(iw,ih*9/16)/2)*2':'trunc(ih/2)*2'[v_lay];"
                V_MAP="v_lay"; FORCE_V_ENCODE_LAY=1
              elif [[ "$V_LAYOUT" == *"Kotak Hitam"* ]]; then
                FILTER="${FILTER}[0:v]pad='trunc(iw/2)*2':'trunc((iw*16/9)/2)*2':0:'trunc((oh-ih)/4)*2':black[v_lay];"
                V_MAP="v_lay"; FORCE_V_ENCODE_LAY=1
              fi
              
              if [[ "$IMAGE_PRESENT" -eq 1 ]]; then
                IMG_IDX="1"; if [[ -n "$AUDIO" ]]; then IMG_IDX="2"; fi
                SCALE_CMD=""
                if [[ "$IMG_SCALE" != "default"* ]]; then 
                  CLEAN_SCALE=$(echo "$IMG_SCALE" | awk '{print $1}')
                  SCALE_CMD="scale=$CLEAN_SCALE,"
                fi
                POS="W-w-10:10"
                if [[ "$IMG_POS" == "Kiri Atas" ]]; then POS="10:10"; fi
                if [[ "$IMG_POS" == "Kanan Bawah" ]]; then POS="W-w-10:H-h-10"; fi
                if [[ "$IMG_POS" == "Kiri Bawah" ]]; then POS="10:H-h-10"; fi
                FILTER="${FILTER}[${IMG_IDX}:v]${SCALE_CMD}format=rgba[wm];[$V_MAP][wm]overlay=$POS:shortest=1[v_img];"
                V_MAP="v_img"
              fi
              
              if [[ -n "$TEXT" ]]; then
                COLOR="white"; if [[ "$TXT_COLOR" != "default"* ]]; then COLOR="$TXT_COLOR"; fi
                SIZE="24"; if [[ "$TXT_SIZE" != "default"* ]];  then SIZE="$TXT_SIZE"; fi
                T_X="10"; T_Y="H-h-30"
                if [[ "$TXT_POS" == "Bawah Tengah" || "$TXT_POS" == "default"* ]]; then T_X="(W-w)/2"; T_Y="H-h-30"; fi
                if [[ "$TXT_POS" == "Kiri Atas" ]]; then T_X="10"; T_Y="10"; fi
                if [[ "$TXT_POS" == "Kanan Atas" ]]; then T_X="W-w-10"; T_Y="10"; fi
                if [[ "$TXT_POS" == "Tengah Screen" ]]; then T_X="(W-w)/2"; T_Y="(H-h)/2"; fi
                FONT_PATH="/usr/share/fonts/truetype/freefont/FreeSans.ttf"
                FILTER="${FILTER}[$V_MAP]drawtext=fontfile=${FONT_PATH}:textfile=stream_text.txt:reload=1:fontcolor=$COLOR:fontsize=$SIZE:x=$T_X:y=$T_Y[v_txt];"
                V_MAP="v_txt"
              fi
              
              CLEAN_VOL_MAIN=$(echo "$A_VOL_MAIN" | awk '{print $1}')
              CLEAN_VOL_EXT=$(echo "$A_VOL_EXT" | awk '{print $1}')

              if [[ "$AUDIO_PRESENT" -eq 1 ]]; then
                HAS_AUDIO=$(timeout 15s ffprobe -v error -analyzeduration 5000000 -probesize 5000000 -select_streams a -show_entries stream=codec_type -of default=nw=1:nk=1 "$VIDEO" 2>/dev/null | head -n 1)
                HAS_EXT_AUDIO=$(timeout 15s ffprobe -v error -analyzeduration 5000000 -probesize 5000000 -select_streams a -show_entries stream=codec_type -of default=nw=1:nk=1 "$AUDIO" 2>/dev/null | head -n 1)
                
                if [[ "$A_MIX" == "Gabungkan"* ]]; then
                  if [[ "$HAS_AUDIO" != "audio" ]]; then
                    echo "⚠️ Peringatan: Video asli bisu. Membatalkan 'amix'."
                    A_MAP="1:a"
                  elif [[ "$HAS_EXT_AUDIO" != "audio" ]]; then
                    echo "⚠️ Peringatan: Audio tambahan tidak valid/bisu. Membatalkan 'amix'."
                    A_MAP="0:a"
                  else
                    V_MAIN_FILT="volume=1.0"; if [[ "$A_VOL_MAIN" != "default"* ]]; then V_MAIN_FILT="volume=$CLEAN_VOL_MAIN"; fi
                    V_EXT_FILT="volume=1.0"; if [[ "$A_VOL_EXT" != "default"* ]]; then V_EXT_FILT="volume=$CLEAN_VOL_EXT"; fi
                    FILTER="${FILTER}[0:a]${V_MAIN_FILT}[a_m];[1:a]${V_EXT_FILT}[a_e];[a_m][a_e]amix=inputs=2:duration=first[a_mix];"
                    A_MAP="a_mix"; USE_A_FILTER=1
                  fi
                else
                  if [[ "$HAS_EXT_AUDIO" == "audio" ]]; then
                    A_MAP="1:a"
                  else
                    echo "⚠️ Peringatan: Audio tambahan tidak valid/bisu. Menggunakan audio asli kembali."
                    A_MAP="0:a"
                  fi
                fi
              else
                A_MAP="0:a"
              fi
              
              if [[ -n "$FILTER" ]]; then
                FILTER=${FILTER%?}
                CMD="$CMD -filter_complex \"$FILTER\""
                if [[ "$V_MAP" == "0:v" ]]; then CMD="$CMD -map 0:v?"; else CMD="$CMD -map \"[$V_MAP]\""; fi
                if [[ "$USE_A_FILTER" -eq 1 ]]; then CMD="$CMD -map \"[$A_MAP]\""; else CMD="$CMD -map $A_MAP?"; fi
              else
                CMD="$CMD -map 0:v? -map $A_MAP?"
              fi
              
              FORCE_V_ENCODE=0; if [[ "$V_MAP" != "0:v" || "$FORCE_V_ENCODE_LAY" -eq 1 ]]; then FORCE_V_ENCODE=1; fi
              
              FINAL_V_CODEC="copy"
              if [[ "$FORCE_V_ENCODE" -eq 1 ]]; then
                if [[ "$V_CODEC" == "default"* ]] || [[ "$V_CODEC" == "copy" ]]; then FINAL_V_CODEC="libx264"; else FINAL_V_CODEC="$V_CODEC"; fi
              else
                if [[ "$V_CODEC" != "default"* ]]; then FINAL_V_CODEC="$V_CODEC"; fi
              fi
              
              if [[ "$FINAL_V_CODEC" == "libx265" && "$RTMP" == *"rtmp"* ]]; then
                echo "⚠️ Peringatan: Container FLV (RTMP) tidak kompatibel dengan codec libx265 (HEVC). Memaksa downgrade ke libx264."
                FINAL_V_CODEC="libx264"
              elif [[ "$FINAL_V_CODEC" == "copy" && "$RTMP" == *"rtmp"* ]]; then
                ORIG_V_CODEC=$(timeout 15s ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$VIDEO" 2>/dev/null | head -n 1)
                if [[ "$ORIG_V_CODEC" == "hevc" || "$ORIG_V_CODEC" == "h265" ]]; then
                   echo "⚠️ Peringatan: Video asli HEVC ditolak oleh RTMP (Mode Copy). Memaksa encode ke libx264."
                   FINAL_V_CODEC="libx264"
                fi
              fi
              
              CMD="$CMD -c:v $FINAL_V_CODEC"
              
              if [[ "$FINAL_V_CODEC" != "copy" ]]; then
                CMD="$CMD -pix_fmt yuv420p"
              fi
              
              if [[ "$V_PRESET" != "default"* && "$FINAL_V_CODEC" != "copy" ]]; then CMD="$CMD -preset $V_PRESET"; fi
              # FIX BUG #8: Bitrate hanya ditambahkan jika codec BUKAN copy
              if [[ "$V_BITRATE" != "default"* && "$FINAL_V_CODEC" != "copy" ]]; then CMD="$CMD -b:v $V_BITRATE"; fi
              if [[ "$V_FPS" != "default"* && "$FINAL_V_CODEC" != "copy" ]]; then CMD="$CMD -r $V_FPS"; fi
              
              # FIX BUG #3: FORCE_A_ENCODE hanya aktif jika volume yang bersangkutan memang relevan
              FORCE_A_ENCODE=0
              # Volume main relevan hanya jika tidak ada audio eksternal (audio asli video yang diubah)
              if [[ -z "$AUDIO" ]] && [[ "$A_VOL_MAIN" != "default"* ]]; then FORCE_A_ENCODE=1; fi
              # Volume ext relevan hanya jika ada audio eksternal
              if [[ "$AUDIO_PRESENT" -eq 1 ]] && [[ "$A_VOL_EXT" != "default"* ]]; then FORCE_A_ENCODE=1; fi

              FINAL_A_CODEC="copy"
              if [[ "$USE_A_FILTER" -eq 1 ]] || [[ "$FORCE_A_ENCODE" -eq 1 ]]; then
                if [[ "$A_CODEC" == "default"* ]] || [[ "$A_CODEC" == "copy" ]]; then FINAL_A_CODEC="aac"; else FINAL_A_CODEC="$A_CODEC"; fi
              else
                if [[ "$A_CODEC" != "default"* ]]; then FINAL_A_CODEC="$A_CODEC"; fi
              fi

              if [[ "$FINAL_A_CODEC" == "copy" && "$RTMP" == *"rtmp"* ]]; then
                 TARGET_AUDIO_FILE="$VIDEO"
                 if [[ "$A_MAP" == "1:a" ]]; then TARGET_AUDIO_FILE="$AUDIO"; fi
                 
                 ORIG_A_CODEC=$(timeout 15s ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$TARGET_AUDIO_FILE" 2>/dev/null | head -n 1)
                 if [[ "$ORIG_A_CODEC" != "aac" && "$ORIG_A_CODEC" != "mp3" ]]; then
                    echo "⚠️ Peringatan: Audio sumber ($ORIG_A_CODEC) ditolak oleh container FLV/RTMP atau gagal dibaca. Memaksa downgrade ke aac."
                    FINAL_A_CODEC="aac"
                 fi
              fi

              CMD="$CMD -c:a $FINAL_A_CODEC"

              if [[ "$FINAL_A_CODEC" != "copy" && "$USE_A_FILTER" -eq 0 ]]; then
                 if [[ "$AUDIO_PRESENT" -eq 1 ]] && [[ "$A_VOL_EXT" != "default"* ]]; then 
                    if [[ "$A_MAP" == "1:a" ]]; then CMD="$CMD -af \"volume=$CLEAN_VOL_EXT\""; fi
                 fi
                 if [[ -z "$AUDIO" ]] && [[ "$A_VOL_MAIN" != "default"* ]]; then 
                    HAS_AUDIO=$(timeout 15s ffprobe -v error -analyzeduration 5000000 -probesize 5000000 -select_streams a -show_entries stream=codec_type -of default=nw=1:nk=1 "$VIDEO" 2>/dev/null | head -n 1)
                    if [[ "$HAS_AUDIO" == "audio" ]]; then
                       CMD="$CMD -af \"volume=$CLEAN_VOL_MAIN\""
                    fi
                 fi
              fi
              
              # BUGFIX-B: A_BITRATE hanya ditambah jika codec bukan copy
              if [[ "$A_BITRATE" != "default"* && "$FINAL_A_CODEC" != "copy" ]]; then CMD="$CMD -b:a $A_BITRATE"; fi
              
              # FIX BUG #5 + BUGFIX-A: RTMP URL aman, KEY kosong tidak buat trailing slash
              RTMP_CLEAN="${RTMP%/}"
              if [[ -z "$KEY" ]]; then
                echo "⚠️ Peringatan: Stream Key kosong! Menggunakan RTMP URL langsung tanpa key."
                CMD="$CMD -f flv \"${RTMP_CLEAN}\""
              else
                CMD="$CMD -f flv \"${RTMP_CLEAN}/${KEY}\""
              fi
              
              FINAL_CMD="$CMD"
            fi

            printf "%s\n" "#!/bin/bash" "$FINAL_CMD" > run_stream.sh
            chmod +x run_stream.sh
            
            echo "================ MENJALANKAN PERINTAH ================"
            # FIX BUG #11: Sensor pattern diperluas untuk single-quote dan rtmps://
            sed "s|rtmps\?://[^'\" ]*|rtmp(s)://[STREAM_KEY_DISENSOR]|g" run_stream.sh | grep -v "#!/bin/bash"
            echo "======================================================"
            
            ./run_stream.sh
            
            if [ $? -ne 0 ]; then
