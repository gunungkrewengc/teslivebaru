name: YouTube Extractor via yt-dlp

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      extract_only:
        description: 'Hanya Ekstrak Info? (true = hanya info / false = download video)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  extract_and_download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # Menginstal FFmpeg dan Node.js langsung via apt-get agar pasti terdeteksi oleh yt-dlp di Linux
    - name: Install FFmpeg and Node.js
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg nodejs -y

    - name: Install yt-dlp
      run: |
        python3 -m pip install --upgrade pip
        pip install yt-dlp

    - name: Run yt-dlp Process with Cookies & TV Client
      run: |
        URL="${{ github.event.inputs.video_url }}"
        EXTRACT="${{ github.event.inputs.extract_only }}"
        
        mkdir -p output_downloads
        cd output_downloads
        
        # Mengambil cookies dari Secrets
        echo "${{ secrets.YT_COOKIES }}" > yt_cookies.txt
        
        # Validasi: Cek apakah file cookies benar-benar ada isinya atau kosong
        if [ ! -s yt_cookies.txt ]; then
          echo "❌ ERROR: File yt_cookies.txt KOSONG! Pastikan kamu sudah membuat secret YT_COOKIES di Settings > Secrets and variables > Actions, dan menempelkan teks cookies ke dalamnya."
          exit 1
        else
          echo "✅ File cookies berhasil dimuat."
        fi
        
        # Senjata ganda: Pakai Cookies + Klien TV agar tidak dicurigai meski IP beda negara
        YT_ARGS="--cookies yt_cookies.txt --extractor-args youtube:player_client=tvhtml5,web --no-warnings"
        
        if [ "$EXTRACT" = "true" ]; then
          echo "=== MEMULAI EKSTRAKSI INFORMASI VIDEO ==="
          yt-dlp $YT_ARGS --dump-json "$URL" > info_video.json
          yt-dlp $YT_ARGS -F "$URL"
        else
          echo "=== MEMULAI DOWNLOAD VIDEO ==="
          yt-dlp $YT_ARGS -f "bv*+ba/b" "$URL"
        fi
        
        # Hapus file cookies agar aman
        rm -f yt_cookies.txt

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: yt-dlp-output
        path: output_downloads/
        retention-days: 1
