name: YouTube Extractor via yt-dlp

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      extract_only:
        description: 'Hanya Ekstrak Info? (true = hanya info / false = download video)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  extract_and_download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg -y

    - name: Install yt-dlp
      run: |
        python3 -m pip install --upgrade pip
        pip install yt-dlp

    - name: Run yt-dlp Process with Cookies
      run: |
        URL="${{ github.event.inputs.video_url }}"
        EXTRACT="${{ github.event.inputs.extract_only }}"
        
        mkdir -p output_downloads
        cd output_downloads
        
        # 1. Memanggil rahasia cookies dari GitHub Secrets dan menjadikannya file
        echo "${{ secrets.YT_COOKIES }}" > yt_cookies.txt
        
        # 2. Proses eksekusi dengan menyertakan file cookies
        if [ "$EXTRACT" = "true" ]; then
          echo "=== MEMULAI EKSTRAKSI INFORMASI VIDEO ==="
          yt-dlp --cookies yt_cookies.txt --no-warnings --dump-json "$URL" > info_video.json
          
          echo "=== DAFTAR FORMAT TERSEDIA ==="
          yt-dlp --cookies yt_cookies.txt --no-warnings -F "$URL"
        else
          echo "=== MEMULAI DOWNLOAD VIDEO ==="
          yt-dlp --cookies yt_cookies.txt --no-warnings -f "bv*+ba/b" "$URL"
        fi
        
        # 3. Menghapus file cookies setelah selesai agar aman
        rm -f yt_cookies.txt

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: yt-dlp-output
        path: output_downloads/
        retention-days: 1
