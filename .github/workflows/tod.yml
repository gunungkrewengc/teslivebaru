name: YouTube Extractor via yt-dlp

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      extract_only:
        description: 'Hanya Ekstrak Info? (true = hanya teks info / false = download videonya)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  extract_and_download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # SOLUSI 1: Install Node.js sebagai JavaScript Runtime agar yt-dlp bisa memecahkan kode player YouTube terbaru
    - name: Set up Node.js (JS Runtime)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg -y

    - name: Install yt-dlp
      run: |
        python3 -m pip install --upgrade pip
        pip install yt-dlp

    # SOLUSI 2: Menggunakan parameter "--extractor-args" untuk menyamar sebagai klien alternatif (iOS/Android) 
    # guna menghindari blokir "Sign in to confirm you're not a bot"
    - name: Run yt-dlp Process
      run: |
        URL="${{ github.event.inputs.video_url }}"
        EXTRACT="${{ github.event.inputs.extract_only }}"
        
        mkdir -p output_downloads
        cd output_downloads
        
        # Menggunakan opsi penyamaran klien agar lolos dari deteksi bot
        YT_ARGS="--extractor-args youtube:player_client=ios,web"
        
        if [ "$EXTRACT" = "true" ]; then
          echo "=== MEMULAI EKSTRAKSI INFORMASI VIDEO ==="
          yt-dlp $YT_ARGS --dump-json "$URL" > info_video.json
          
          echo "=== DAFTAR FORMAT TERSEDIA ==="
          yt-dlp $YT_ARGS -F "$URL"
        else
          echo "=== MEMULAI DOWNLOAD VIDEO (KUALITAS TERBAIK) ==="
          yt-dlp $YT_ARGS -f "bv*+ba/b" "$URL"
        fi

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: yt-dlp-output
        path: output_downloads/
        retention-days: 1
